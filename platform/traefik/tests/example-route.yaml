tls:
  certificates:
    - certFile: /etc/traefik/dynamic/98-example-cert.test.pem
      keyFile: /etc/traefik/dynamic/98-example-key.test.pem

http:
  routers:
    example-service:
      rule: "Host(`example.localhost`)"
      entryPoints:
        - websecure
      service: example-service
      middlewares:
        - platform-response-headers
      tls: {}

  middlewares:
    platform-response-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          X-Merchfactory-Proxy: "traefik"

  services:
    example-service:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: /health
          interval: "1s"
          timeout: "500ms"
          status: 200
        servers:
          - url: "http://example-service:80"
