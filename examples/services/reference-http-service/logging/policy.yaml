version: 1
service: reference-http-service

container:
  stdout: true
  stderr: true
  application_log_files: false
  driver: local
  inherit_daemon_logging: true
  service_logging_override_allowed: false
  rotation:
    max_size: 20m
    max_files: 5
    compress: true

central_retention:
  default_class: standard
  standard_days: 30

requirements:
  - Keine Secrets oder personenbezogenen Daten in Logs.
  - Production-Debuglogging bleibt deaktiviert.
