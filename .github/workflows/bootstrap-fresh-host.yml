name: Bootstrap Fresh Host

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-fresh-host-development
  cancel-in-progress: false

jobs:
  fresh-host:
    name: Bootstrap fresh development host
    if: vars.DEVELOPMENT_BOOTSTRAP_FRESH_HOST_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Ansible installieren
        run: |
          set -Eeuo pipefail
          python3 -m pip install 'ansible-core>=2.17,<2.19'
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Pflicht-Secrets validieren
        env:
          TEST_HOST: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_HOST }}
          TEST_USER: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$TEST_HOST"
          test -n "$TEST_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: SSH-Zugang vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bootstrap-test"
          chmod 0600 "$RUNNER_TEMP/bootstrap-test"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/bootstrap-test" \
            > /tmp/bootstrap-managed.pub

      - name: Temporäre Testinventare erstellen
        env:
          TEST_HOST: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_HOST }}
          INITIAL_USER: ${{ secrets.DEVELOPMENT_BOOTSTRAP_TEST_USER }}
          MANAGED_USER: bootstrap
        run: |
          set -Eeuo pipefail
          python3 scripts/create-bootstrap-test-inventories.py \
            --host "$TEST_HOST" \
            --initial-user "$INITIAL_USER" \
            --managed-user "$MANAGED_USER" \
            --public-key-file /tmp/bootstrap-managed.pub \
            --initial-output /tmp/bootstrap-initial.json \
            --managed-output /tmp/bootstrap-managed.json
          ansible-inventory -i /tmp/bootstrap-initial.json --graph
          ansible-inventory -i /tmp/bootstrap-managed.json --graph

      - name: Fresh-Host-Test ausführen
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/bootstrap-test
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          BOOTSTRAP_COMMIT_SHA: ${{ github.sha }}
          BOOTSTRAP_CORRELATION_ID: >-
            gh-${{ github.run_id }}-${{ github.run_attempt }}
          BOOTSTRAP_ENVIRONMENT: development
        run: |
          set -Eeuo pipefail
          test -f "$ANSIBLE_PRIVATE_KEY_FILE"
          test "$(stat -c '%a' "$ANSIBLE_PRIVATE_KEY_FILE")" = '600'
          bash scripts/test-bootstrap-fresh-host.sh \
            /tmp/bootstrap-initial.json \
            /tmp/bootstrap-managed.json \
            bootstrap-test

      - name: Ergebnis in Job Summary schreiben
        if: always()
        run: |
          if [[ -f artifacts/bootstrap-fresh-host/summary.txt ]]; then
            {
              echo '## Bootstrap Fresh Host'
              echo '```text'
              cat artifacts/bootstrap-fresh-host/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-fresh-host-results
          path: artifacts/bootstrap-fresh-host/
          if-no-files-found: warn
          retention-days: 14

      - name: Temporäre Zugangsdaten entfernen
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/bootstrap-test"
          rm -f /tmp/bootstrap-managed.pub
          rm -f /tmp/bootstrap-initial.json
          rm -f /tmp/bootstrap-managed.json
