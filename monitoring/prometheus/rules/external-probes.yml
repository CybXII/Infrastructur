groups:
  - name: external-probes
    rules:
      - alert: BlackboxExporterUnavailable
        expr: up{job=~"blackbox-(http|dns|tls|exporter)"} == 0
        for: 3m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: Blackbox exporter scrape failed
          description: "Prometheus cannot scrape blackbox probe {{ $labels.instance }} ({{ $labels.job }})."
          runbook: docs/74-external-probes-design.md

      - alert: PublicEndpointHTTPUnavailable
        expr: probe_success{job="blackbox-http"} == 0 and on (instance) up{job="blackbox-http"} == 1
        for: 5m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: Public HTTPS endpoint unavailable
          description: "HTTP probe failed for {{ $labels.instance }}."
          runbook: docs/74-external-probes-design.md

      - alert: PublicEndpointDNSFailure
        expr: probe_success{job="blackbox-dns"} == 0 and on (instance) up{job="blackbox-dns"} == 1
        for: 5m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: DNS lookup failed
          description: "DNS probe failed for {{ $labels.instance }}."
          runbook: docs/74-external-probes-design.md

      - alert: PublicEndpointTLSFailure
        expr: probe_success{job="blackbox-tls"} == 0 and on (instance) up{job="blackbox-tls"} == 1
        for: 5m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: TLS handshake failed
          description: "TLS probe failed for {{ $labels.instance }}."
          runbook: docs/74-external-probes-design.md

      - alert: PublicCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 30 * 86400 and (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) >= 7 * 86400
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: TLS certificate expires within 30 days
          description: "Certificate for {{ $labels.instance }} expires in less than 30 days."
          runbook: docs/74-external-probes-design.md

      - alert: PublicCertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 7 * 86400
        for: 10m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: TLS certificate expires within 7 days
          description: "Certificate for {{ $labels.instance }} expires in less than 7 days."
          runbook: docs/74-external-probes-design.md
