groups:
  - name: prometheus-self-monitoring
    rules:
      - alert: PrometheusConfigurationReloadFailure
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Prometheus configuration reload failed
          description: Prometheus has reported an unsuccessful configuration reload for at least five minutes.
          runbook: docs/62-prometheus.md

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Prometheus rule evaluation failures detected
          description: One or more Prometheus rule evaluations failed during the last ten minutes.
          runbook: docs/62-prometheus.md

      - alert: PrometheusTSDBCompactionsFailing
        expr: increase(prometheus_tsdb_compactions_failed_total[15m]) > 0
        labels:
          severity: high
          owner: platform
        annotations:
          summary: Prometheus TSDB compaction is failing
          description: Prometheus has reported TSDB compaction failures during the last fifteen minutes.
          runbook: docs/62-prometheus.md

      - alert: PrometheusSelfScrapeDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: high
          owner: platform
        annotations:
          summary: Prometheus self-scrape is down
          description: Prometheus cannot scrape its own metrics endpoint.
          runbook: docs/62-prometheus.md
