global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: "${PROMETHEUS_ENVIRONMENT}"
    host: "${PROMETHEUS_HOST}"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          service: prometheus
          component: metrics

  - job_name: node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-exporter.yml
        refresh_interval: 5m

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor.yml
        refresh_interval: 5m

  - job_name: alloy
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/alloy.yml
        refresh_interval: 5m

  # The exporter itself is observed even before public targets are enabled.
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
        labels:
          service: blackbox-exporter
          component: probe-exporter

  # Generic service-owned targets are generated/validated by platform registration.
  # Do not embed application hostnames in this central config.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/service-targets/http/*.json]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tls
    metrics_path: /probe
    params:
      module: [tcp_tls]
    file_sd_configs:
      - files: [/etc/prometheus/service-targets/tls/*.json]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
