# Generic platform-owned probe modules; application-specific destinations live in application repositories.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
  tcp_tls:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: ip4
      tls: true
# DNS requires an explicit query_name in blackbox_exporter; the application
# registers its hostname as data and the platform will generate a validated
# per-domain DNS modules during a later authorized infrastructure deploy.
