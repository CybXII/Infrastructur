---
all:
  children:
    bootstrap_targets:
      children:
        load_balancers: {}
        app_servers: {}
        database_servers: {}
        monitoring_servers: {}
        backup_servers: {}
        app_deployment_hosts: {}
        edge_hosts: {}
        runner_hosts: {}

    load_balancers:
      hosts: {}

    app_servers:
      hosts: {}

    database_servers:
      hosts: {}

    monitoring_servers:
      hosts: {}

    backup_servers:
      hosts: {}

    # Hosts mit eigenem unprivilegierten CI/CD-Deployment-Benutzer.
    app_deployment_hosts:
      hosts: {}

    # Hosts mit öffentlichem Traefik-Edge-Proxy und Ports 80/443.
    edge_hosts:
      hosts: {}

    # Optional: genau einen bereits verwalteten VPS auswählen, auf dem die
    # GitHub-Runner-Plattform als Docker-Anwendung laufen soll. Der Host darf
    # gleichzeitig weitere Rollen besitzen. Ein dedizierter Runner-VPS ist
    # später die stärkere Sicherheitsgrenze, aber technisch nicht erforderlich.
    runner_hosts:
      hosts: {}
