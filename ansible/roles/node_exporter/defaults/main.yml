---
node_exporter_enabled: true

node_exporter_version: "1.12.1"
node_exporter_archive_name: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive_name }}
node_exporter_archive_sha256: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"

node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_binary_path: /usr/local/bin/node_exporter
node_exporter_cache_dir: /var/lib/merchfactory/downloads
node_exporter_extract_root: /var/lib/merchfactory/node_exporter
node_exporter_extract_dir: "{{ node_exporter_extract_root }}/{{ node_exporter_version }}"
node_exporter_archive_path: "{{ node_exporter_cache_dir }}/{{ node_exporter_archive_name }}"

node_exporter_service_name: node_exporter.service
node_exporter_service_path: "/etc/systemd/system/{{ node_exporter_service_name }}"

node_exporter_monitoring_network: merchfactory-monitoring
node_exporter_monitoring_subnet: 172.30.250.0/24
node_exporter_monitoring_gateway: 172.30.250.1
node_exporter_monitoring_bridge: mf-monitoring0
node_exporter_listen_port: 9100
node_exporter_listen_address: "{{ node_exporter_monitoring_gateway }}:{{ node_exporter_listen_port }}"
node_exporter_netdev_use_netlink: false
node_exporter_textfile_directory: /var/lib/merchfactory/node_exporter/textfile
node_exporter_textfile_group: merchfactory-backup-metrics

node_exporter_network_script_source: "{{ playbook_dir }}/../../platform/network/scripts/prepare-monitoring-network.sh"
node_exporter_network_script_path: /usr/local/sbin/merchfactory-prepare-monitoring-network

node_exporter_cpu_quota: 25%
node_exporter_memory_max: 128M
node_exporter_tasks_max: 128

node_exporter_filesystem_mount_points_exclude: >-
  ^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+|var/lib/containers/.+)($|/)
node_exporter_filesystem_fs_types_exclude: >-
  ^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
