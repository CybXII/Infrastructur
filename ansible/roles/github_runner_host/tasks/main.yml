---
- name: Runner-Token wurde sicher übergeben
  ansible.builtin.assert:
    that:
      - github_runner_token | length > 0
    fail_msg: >-
      github_runner_token fehlt. Das Secret muss beim Bootstrap zur Laufzeit
      übergeben werden und darf nicht im Inventory oder Repository liegen.
  no_log: true

- name: Runner-Scope-Konfiguration validieren
  ansible.builtin.assert:
    that:
      - github_runner_config_urls | length > 0
      - (github_runner_config_urls | unique | list | length) == (github_runner_config_urls | length)
      - (github_runner_config_urls | length == 1) or (github_runner_min_runners | int == 0)
      - github_runner_max_runners | int >= 1
    fail_msg: >-
      Ungueltige Runner-Scope-Konfiguration. Es muss mindestens ein eindeutiger
      GitHub-Scope existieren; bei Multi-Scope muss MIN_RUNNERS=0 sein und
      MAX_RUNNERS mindestens 1.

- name: Runner-Zielverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ github_runner_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Aktuellen Commit des Runner-Repositories auflösen
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ github_runner_repo_owner }}/{{ github_runner_repo_name
      }}/commits/{{ github_runner_repo_ref }}
    method: GET
    headers:
      Authorization: "Bearer {{ github_runner_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    return_content: true
    status_code: 200
  register: github_runner_repo_commit_response
  changed_when: false
  no_log: true

- name: Gewünschten Runner-Commit merken
  ansible.builtin.set_fact:
    github_runner_repo_sha: "{{ github_runner_repo_commit_response.json.sha }}"

- name: Installierten Runner-Commit lesen
  ansible.builtin.command:
    cmd: cat "{{ github_runner_install_dir }}/.source-sha"
  register: github_runner_installed_commit
  changed_when: false
  failed_when: false

- name: Runner-Quellstand vergleichen
  ansible.builtin.set_fact:
    github_runner_source_changed: >-
      {{
        github_runner_installed_commit.rc != 0
        or github_runner_installed_commit.stdout | trim != github_runner_repo_sha
      }}

- name: Runner-Repository als Archiv laden
  ansible.builtin.get_url:
    url: >-
      https://api.github.com/repos/{{ github_runner_repo_owner }}/{{ github_runner_repo_name
      }}/tarball/{{ github_runner_repo_sha }}
    dest: "/tmp/github-runners-{{ github_runner_repo_sha }}.tar.gz"
    mode: "0600"
    headers:
      Authorization: "Bearer {{ github_runner_token }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
  when: github_runner_source_changed
  no_log: true

- name: Veraltete Runner-Deployment-Dateien entfernen
  ansible.builtin.shell: |
    set -Eeuo pipefail
    find "{{ github_runner_install_dir }}" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf -- {} +
  args:
    executable: /bin/bash
  when: github_runner_source_changed
  changed_when: true

- name: Runner-Repository entpacken
  ansible.builtin.unarchive:
    src: "/tmp/github-runners-{{ github_runner_repo_sha }}.tar.gz"
    dest: "{{ github_runner_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: github_runner_source_changed

- name: Installierten Runner-Commit schreiben
  ansible.builtin.copy:
    content: "{{ github_runner_repo_sha }}\n"
    dest: "{{ github_runner_install_dir }}/.source-sha"
    owner: root
    group: root
    mode: "0600"
  when: github_runner_source_changed

- name: Runner-Konfiguration schreiben
  ansible.builtin.template:
    src: runner.env.j2
    dest: "{{ github_runner_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: github_runner_env
  no_log: true

- name: Docker-in-Docker Basisimage prüfen
  ansible.builtin.command:
    cmd: "docker image inspect {{ github_runner_dind_image }}"
  register: github_runner_dind_inspect
  changed_when: false
  failed_when: false

- name: Docker-in-Docker Basisimage laden
  ansible.builtin.command:
    cmd: "docker pull {{ github_runner_dind_image }}"
  when: github_runner_dind_inspect.rc != 0
  changed_when: true

- name: Runner-Controller und universelles Runner-Image bauen
  ansible.builtin.command:
    cmd: docker compose --env-file .env build controller runner-image
    chdir: "{{ github_runner_install_dir }}"
  when: github_runner_source_changed or github_runner_env.changed
  changed_when: true

- name: Laufenden Runner-Controller vor Änderung prüfen
  ansible.builtin.command:
    cmd: docker compose --env-file .env ps --status running --services controller
    chdir: "{{ github_runner_install_dir }}"
  register: github_runner_controller_before
  changed_when: false
  failed_when: false

- name: Runner-Controller starten oder aktualisieren
  ansible.builtin.command:
    cmd: docker compose --env-file .env up -d controller
    chdir: "{{ github_runner_install_dir }}"
  register: github_runner_controller_up
  changed_when: >-
    github_runner_source_changed
    or github_runner_env.changed
    or github_runner_controller_before.rc != 0
    or 'controller' not in github_runner_controller_before.stdout_lines

- name: Runner-Controller-Status prüfen
  ansible.builtin.command:
    cmd: docker compose --env-file .env ps --status running --services controller
    chdir: "{{ github_runner_install_dir }}"
  register: github_runner_controller_status
  changed_when: false
  failed_when: >-
    github_runner_controller_status.rc != 0
    or 'controller' not in github_runner_controller_status.stdout_lines

- name: Temporäres Runner-Archiv entfernen
  ansible.builtin.file:
    path: "/tmp/github-runners-{{ github_runner_repo_sha }}.tar.gz"
    state: absent
  when: github_runner_source_changed
